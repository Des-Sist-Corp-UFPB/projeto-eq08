# =============================================================================
# GitHub Actions — Build, Testes e Deploy (Simplificado)
# =============================================================================
#
# Este workflow executa em 3 etapas sequenciais (jobs) otimizadas:
#
#   [1] test  →  [2] build-and-push  →  [3] deploy
#
# Etapa 1 — Testes:
#   Compila o projeto e roda os testes unitários e de integração.
#   Os testes de integração usam Testcontainers (PostgreSQL real no Docker).
#
# Etapa 2 — Build e Push:
#   Constrói a imagem Docker de produção e envia para o GHCR.
#
# Etapa 3 — Deploy:
#   Atualiza o docker-compose.prod.yml no servidor, baixa a nova imagem e
#   reinicia o container de forma segura, validando a saúde da aplicação.
#
# =============================================================================

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ============================================================================
  # JOB 1 — Compilação e Testes (Unitários e Integração)
  # ============================================================================
  test:
    name: Compilação e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e rodar testes
        run: mvn verify -B

  # ============================================================================
  # JOB 2 — Build da imagem Docker e Push para o GHCR (Versão Otimizada)
  # ============================================================================
  build-and-push:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (tags e labels OCI)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Configurar Docker Buildx (BuildKit)
        uses: docker/setup-buildx-action@v3

      - name: Build e push para o GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 3 — Deploy no servidor via SSH
  # ============================================================================
  deploy:
    name: Deploy em produção
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Garante que o diretório de destino existe no servidor
      - name: Criar diretório de destino se não existir
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: eq08.dsc.rodrigor.com
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            mkdir -p /opt/eq08/docker

      # Copia o docker-compose.prod.yml para o servidor a cada deploy.
      - name: Copiar docker-compose.prod.yml para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: eq08.dsc.rodrigor.com
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          source: docker/docker-compose.prod.yml
          target: /opt/eq08/

      # Script de deploy executado no servidor via SSH.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPO_NAME: ${{ github.repository }}
          REGISTRY: ${{ env.REGISTRY }}
        with:
          host: eq08.dsc.rodrigor.com
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,REPO_NAME,REGISTRY
          script_stop: true
          script: |
            set -euo pipefail

            # Converte o nome do repositório para minúsculas (Docker exige lowercase)
            REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
            IMAGE_FULL="$REGISTRY/$REPO_LOWER:latest"

            DEPLOY_DIR="/opt/eq08"
            COMPOSE_FILE="$DEPLOY_DIR/docker/docker-compose.prod.yml"

            echo "======================================================"
            echo " Deploy iniciado: $(date)"
            echo " Imagem: $IMAGE_FULL"
            echo "======================================================"

            # ── 1. Autenticar no GHCR ──────────────────────────────────────
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            echo "✓ Autenticado no GHCR"

            # ── 2. Baixar a nova imagem ────────────────────────────────────
            docker pull "$IMAGE_FULL"
            echo "✓ Imagem baixada: $IMAGE_FULL"

            # ── 3. Atualizar a referência da imagem no .env ────────────────
            cd "$DEPLOY_DIR"
            if grep -q "^APP_IMAGE=" .env 2>/dev/null; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$IMAGE_FULL|" .env
            else
              echo "APP_IMAGE=$IMAGE_FULL" >> .env
            fi
            echo "✓ .env atualizado com APP_IMAGE=$IMAGE_FULL"

            # ── 4. Reiniciar APENAS o container da aplicação ──────────────
            echo "Reiniciando container da aplicação..."
            docker compose -f "$COMPOSE_FILE" up -d \
              --no-deps \
              --force-recreate \
              app
            echo "✓ Container reiniciado"

            # ── 5. Verificar saúde da aplicação com retry ─────────────────
            echo "Aguardando a aplicação ficar saudável (máx. 90s)..."
            for i in $(seq 1 18); do
              if curl -sf http://localhost:8108/actuator/health > /dev/null 2>&1; then
                echo "✓ Aplicação saudável! ($(( i * 5 ))s)"
                break
              fi
              if [ "$i" -eq 18 ]; then
                echo "✗ ERRO: aplicação não ficou saudável após 90 segundos"
                echo "--- Últimas 80 linhas do log da aplicação ---"
                docker logs mercado-app-prod --tail 80
                exit 1
              fi
              echo "  aguardando... ($i/18, $(( i * 5 ))s)"
              sleep 5
            done

            # ── 6. Limpar imagens antigas ──────────────────────────────────
            docker image prune -f > /dev/null
            echo "✓ Imagens antigas removidas"

            echo "======================================================"
            echo " Deploy concluído com sucesso: $(date)"
            echo "======================================================"
