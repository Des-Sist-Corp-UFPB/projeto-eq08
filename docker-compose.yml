version: '3.8'

services:
  backend:
    image: ghcr.io/des-sist-corp-ufpb/projeto-eq08:latest
    container_name: eq08_backend
    restart: always
    ports:
      - "127.0.0.1:8108:8080"
    environment:
      # Banco de dados — variáveis injetadas pelo Portainer
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eq08
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: 10
      # JWT
      SECRET_KEY: ${SECRET_KEY}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: gestor_db
    restart: always
    environment:
      POSTGRES_USER: gestor_user
      POSTGRES_PASSWORD: gestor_password
      POSTGRES_DB: gestor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor_user -d gestor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gestor_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
