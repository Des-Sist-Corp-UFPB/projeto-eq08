<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="modal">
    <div class="modal fade" id="movimentacaoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-arrow-left-right me-2" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M1 11.5a.5.5 0 0 0 .5.5h11.793l-3.147 3.146a.5.5 0 0 0 .708.708l4-4a.5.5 0 0 0 0-.708l-4-4a.5.5 0 0 0-.708.708L13.293 11H1.5a.5.5 0 0 0-.5.5m14-7a.5.5 0 0 1-.5.5H2.707l3.147 3.146a.5.5 0 1 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 4H14.5a.5.5 0 0 1 .5.5"/>
                        </svg>
                        Movimentar Estoque: <span th:text="${produto.nome}">Produto</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <form th:object="${form}"
                      hx-post="/estoque/movimentar"
                      th:attr="hx-target='#produto-' + ${produto.id}"
                      hx-swap="outerHTML"
                      hx-on--after-request="if(event.detail.successful) { bootstrap.Modal.getInstance(document.getElementById('movimentacaoModal')).hide(); }">
                    
                    <input type="hidden" th:field="*{produtoId}" />

                    <div class="modal-body">
                        <!-- Tipo de Movimentação -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tipo de Operação</label>
                            <div class="d-flex gap-3">
                                <div class="form-check" th:each="t : ${tipos}">
                                    <input class="form-check-input" type="radio" th:field="*{tipo}" th:value="${t}" th:id="'tipo-' + ${t}" required>
                                    <label class="form-check-label" th:for="'tipo-' + ${t}" th:text="${t.descricao}">Entrada</label>
                                </div>
                            </div>
                        </div>

                        <!-- Quantidade -->
                        <div class="mb-3">
                            <label for="quantidade" class="form-label fw-semibold">Quantidade (<span th:text="${produto.unidadeMedida}">UN</span>)</label>
                            <input type="number" th:field="*{quantidade}" class="form-control" step="0.01" min="0.01" required placeholder="0,00" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('quantidade')}" th:errors="*{quantidade}">Erro na quantidade</div>
                        </div>

                        <!-- Data de Validade (Apenas para Entradas e se for Perecível) -->
                        <div class="mb-3" th:if="${produto.perecivel}" id="validade-container">
                            <label for="dataValidade" class="form-label fw-semibold">Data de Validade</label>
                            <input type="date" th:field="*{dataValidade}" class="form-control" />
                            <div class="form-text">Obrigatório para produtos perecíveis na entrada.</div>
                        </div>

                        <!-- Motivo/Notas -->
                        <div class="mb-3">
                            <label for="motivo" class="form-label fw-semibold">Motivo / Observação</label>
                            <input type="text" th:field="*{motivo}" class="form-control" placeholder="Ex: Compra fornecedor X, Ajuste de inventário..." />
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">
                            Confirmar Movimentação
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
