<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{templates/layout :: head}"></head>
<body class="bg-body-secondary vh-100 d-flex flex-column">

<th:block th:include="~{templates/fragments/navbar.html}"></th:block>

<main class="container-fluid flex-grow-1 overflow-hidden p-0">
    <div class="row g-0 h-100">
        
        <!-- Catálogo de Produtos (Esquerda) -->
        <div class="col-12 col-md-8 col-xl-9 bg-white h-100 d-flex flex-column border-end">
            <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
                <h1 class="h4 fw-bold mb-0"><i class="bi bi-cart me-2"></i>Ponto de Venda</h1>
                <input type="text" class="form-control w-50" placeholder="Buscar produto..." id="pdvSearch">
            </div>
            
            <div class="p-3 flex-grow-1 overflow-auto bg-body-secondary">
                <div class="row g-3">
                    <div class="col-6 col-sm-4 col-md-4 col-lg-3 col-xl-2" th:each="p : ${products}">
                        <div class="card h-100 shadow-sm border-0 cursor-pointer text-center pdv-product"
                             th:onclick="'Cart.addItem(\'' + ${p.id()} + '\', \'' + ${p.name().replace('\'', '\\\'')} + '\', ' + ${p.price()} + ')'">
                            <div class="card-body p-3 d-flex flex-column justify-content-between">
                                <div class="bg-light rounded-circle mx-auto mb-2 d-flex align-items-center justify-content-center text-primary fw-bold" style="width: 50px; height: 50px; font-size: 1.2rem;">
                                    <span th:text="${#strings.substring(p.name(), 0, 1)}">P</span>
                                </div>
                                <h6 class="card-title small lh-sm mb-2" th:text="${p.name()}">Nome</h6>
                                <span class="fw-bold text-success" th:text="'R$ ' + ${#numbers.formatDecimal(p.price(), 1, 'COMMA', 2, 'POINT')}">R$ 0</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 text-center py-5 text-muted" th:if="${#lists.isEmpty(products)}">
                        <i class="bi bi-box-seam fs-1 mb-3 d-block"></i>
                        Nenhum produto cadastrado para venda.
                    </div>
                </div>
            </div>
        </div>

        <!-- Carrinho / Comanda (Direita) -->
        <div class="col-12 col-md-4 col-xl-3 h-100 d-flex flex-column bg-white">
            <div class="p-3 bg-light border-bottom text-center">
                <h5 class="fw-bold mb-0">Carrinho (<span id="cartCount">0</span>)</h5>
            </div>
            
            <div class="flex-grow-1 overflow-auto p-3" id="cartItems">
                <p class="text-muted text-center py-3 mb-0">Carrinho vazio</p>
            </div>
            
            <div class="p-3 bg-light border-top shadow-sm z-1">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fs-5 text-muted">Total:</span>
                    <span class="fs-3 fw-bold text-primary" id="cartTotal">R$ 0,00</span>
                </div>
                
                <form id="saleForm" action="/vendas" method="post">
                    <!-- Inputs gerados via JS -->
                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow" id="finalizeSaleBtn" disabled>
                        <i class="bi bi-check-circle me-2"></i>Finalizar Venda
                    </button>
                </form>
            </div>
        </div>

    </div>
</main>

<style>
.cursor-pointer { cursor: pointer; transition: transform 0.1s; }
.cursor-pointer:active { transform: scale(0.96); }
.pdv-product:hover { border: 2px solid var(--color-primary) !important; padding: -2px; }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script>
document.getElementById('pdvSearch').addEventListener('keyup', function() {
    let term = this.value.toLowerCase();
    document.querySelectorAll('.pdv-product').forEach(el => {
        let name = el.querySelector('.card-title').textContent.toLowerCase();
        el.parentElement.style.display = name.includes(term) ? '' : 'none';
    });
});
</script>
</body>
</html>
