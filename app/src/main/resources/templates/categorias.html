<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{templates/layout :: head}"></head>
<body class="bg-body-secondary">

<th:block th:include="~{templates/fragments/navbar.html}"></th:block>

<main class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-tags text-warning me-2"></i>Categorias</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#categoryModal" th:if="${currentUser.role() != 'OPERATOR'}">
            <i class="bi bi-plus-lg me-1"></i>Nova Categoria
        </button>
    </div>

    <!-- Filtros simples (HTMX) -->
    <div class="mb-3 d-flex gap-2">
        <a href="/categorias" class="btn btn-sm btn-outline-secondary" th:classappend="${param.type == null} ? 'active' : ''">Todas</a>
        <a href="/categorias?type=INSUMO" class="btn btn-sm btn-outline-secondary" th:classappend="${param.type != null and param.type[0] == 'INSUMO'} ? 'active' : ''">Insumos</a>
        <a href="/categorias?type=PRODUCT" class="btn btn-sm btn-outline-secondary" th:classappend="${param.type != null and param.type[0] == 'PRODUCT'} ? 'active' : ''">Produtos</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th class="text-end" th:if="${currentUser.role() != 'OPERATOR'}">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="3" class="text-center py-4 text-muted">Nenhuma categoria encontrada.</td>
                        </tr>
                        <tr th:each="cat : ${categories}">
                            <td class="fw-semibold" th:text="${cat.name()}">Nome</td>
                            <td>
                                <span class="badge" th:classappend="${cat.type() == 'INSUMO'} ? 'bg-secondary' : 'bg-primary'"
                                      th:text="${cat.type() == 'INSUMO' ? 'Insumo' : 'Produto'}">Tipo</span>
                            </td>
                            <td class="text-end" th:if="${currentUser.role() != 'OPERATOR'}">
                                <form th:action="@{'/categorias/' + ${cat.id()}}" method="post" class="d-inline">
                                    <input type="hidden" name="_method" value="delete">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" data-confirm="Excluir esta categoria? Pode afetar itens vinculados."><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Modal Nova Categoria -->
<div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <form action="/categorias" method="post">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Nova Categoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nome da Categoria</label>
                        <input type="text" name="name" class="form-control" placeholder="Ex: Laticínios, Bebidas..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select name="type" class="form-select" required>
                            <option value="INSUMO">Insumo / Ingrediente</option>
                            <option value="PRODUCT">Produto Final / Cardápio</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
