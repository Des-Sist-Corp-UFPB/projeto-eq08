<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{templates/layout :: head}"></head>
<body class="bg-body-secondary">

<nav th:replace="~{templates/layout :: navbar}"></nav>
<!-- Include do fragmento navbar provisório até consolidar o layout -->
<th:block th:include="~{templates/fragments/navbar.html}"></th:block>

<main class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-people text-info me-2"></i>Colaboradores</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal">
            <i class="bi bi-plus-lg me-1"></i>Novo Colaborador
        </button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th>Status</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="5" class="text-center py-4 text-muted">Nenhum colaborador cadastrado.</td>
                        </tr>
                        <tr th:each="user : ${users}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px; font-weight: bold;">
                                        <span th:text="${#strings.substring(user.name(), 0, 1)}">U</span>
                                    </div>
                                    <span class="fw-semibold" th:text="${user.name()}">Nome</span>
                                </div>
                            </td>
                            <td th:text="${user.email()}">email</td>
                            <td>
                                <span class="badge" th:classappend="${user.role() == 'OWNER' ? 'bg-danger' : (user.role() == 'MANAGER' ? 'bg-warning' : 'bg-info')}" th:text="${user.role()}">ROLE</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${user.isActive()} ? 'bg-success' : 'bg-secondary'" th:text="${user.isActive()} ? 'Ativo' : 'Inativo'">Status</span>
                            </td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-secondary me-1" th:onclick="'editUser(\'' + ${user.id()} + '\')'"><i class="bi bi-pencil"></i></button>
                                <form th:action="@{'/usuarios/' + ${user.id()}}" method="post" class="d-inline" th:if="${user.id() != currentUser.id()}">
                                    <input type="hidden" name="_method" value="delete"> <!-- Method spoofing ou via HTMX se for o caso -->
                                    <button type="submit" class="btn btn-sm btn-outline-danger" data-confirm="Excluir este colaborador?"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Modal Novo Colaborador -->
<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <form action="/usuarios" method="post">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Novo Colaborador</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha Temporária</label>
                        <input type="password" name="password" class="form-control" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Perfil</label>
                        <select name="role" class="form-select" required>
                            <option value="OPERATOR">Operador (Caixa, Atendimento)</option>
                            <option value="SUPERVISOR">Supervisor</option>
                            <option value="MANAGER" th:if="${currentUser.role() == 'OWNER' or currentUser.role() == 'SUPER_ADMIN'}">Gerente</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
