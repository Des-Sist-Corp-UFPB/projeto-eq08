<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registrar Empresa — Gestor de Negócio SaaS">
    <title>Registrar Empresa | Gestor de Negócio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">

<div class="min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-lg border-0" style="max-width: 520px; width: 100%;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-building-add fs-1 text-primary mb-2 d-block"></i>
                <h1 class="h4 fw-bold text-primary mb-1">Registrar Empresa</h1>
                <p class="text-muted small">Crie sua conta e comece a gerenciar seu negócio</p>
            </div>

            <div class="alert alert-danger d-flex align-items-center" th:if="${error}" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Erro</span>
            </div>

            <form method="post" action="/register" id="registerForm">

                <h6 class="text-muted fw-semibold mb-3 text-uppercase small">Dados da Empresa</h6>

                <div class="mb-3">
                    <label for="companyName" class="form-label fw-semibold">Nome da Empresa <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="companyName" name="companyName"
                           th:value="${companyName}" placeholder="Ex: Padaria do João"
                           required maxlength="255">
                </div>

                <div class="mb-4">
                    <label for="slug" class="form-label fw-semibold">Identificador (slug) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text text-muted small">gestor.app/</span>
                        <input type="text" class="form-control" id="slug" name="slug"
                               th:value="${slug}" placeholder="padaria-do-joao"
                               required pattern="[a-z0-9\-]+" maxlength="255">
                    </div>
                    <div class="form-text">Somente letras minúsculas, números e hifens.</div>
                </div>

                <hr class="my-3">
                <h6 class="text-muted fw-semibold mb-3 text-uppercase small">Administrador</h6>

                <div class="mb-3">
                    <label for="adminName" class="form-label fw-semibold">Nome completo <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="adminName" name="adminName"
                           th:value="${adminName}" placeholder="João Silva" required>
                </div>

                <div class="mb-3">
                    <label for="adminEmail" class="form-label fw-semibold">E-mail <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="adminEmail" name="adminEmail"
                           th:value="${adminEmail}" placeholder="admin@empresa.com" required>
                </div>

                <div class="mb-4">
                    <label for="adminPassword" class="form-label fw-semibold">Senha <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="adminPassword" name="adminPassword"
                               placeholder="Mínimo 8 caracteres" required minlength="8">
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="togglePassword('adminPassword', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
                    <i class="bi bi-building-add me-2"></i>Criar Empresa e Conta
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="/login" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Voltar ao Login</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    field.type = field.type === 'password' ? 'text' : 'password';
    icon.className = field.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}

// Auto-gerar slug a partir do nome da empresa
document.getElementById('companyName').addEventListener('input', function() {
    const slugField = document.getElementById('slug');
    if (!slugField.dataset.manual) {
        slugField.value = this.value
            .toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .slice(0, 50);
    }
});

document.getElementById('slug').addEventListener('input', function() {
    this.dataset.manual = 'true';
});
</script>
</body>
</html>
