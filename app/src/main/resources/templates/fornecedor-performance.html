<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{templates/layout :: head}"></head>
<body class="bg-body-secondary">

<th:block th:include="~{templates/fragments/navbar.html}"></th:block>

<main class="container-fluid px-4 py-4">
    <div class="mb-4">
        <a href="/fornecedores" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i>Voltar para Fornecedores</a>
        <h1 class="h3 fw-bold mt-2"><i class="bi bi-clipboard-data text-primary me-2"></i>Performance: <span th:text="${supplier.name()}"></span></h1>
    </div>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100 kpi-card kpi-primary">
                <div class="card-body">
                    <p class="text-muted small mb-1">Total de Pedidos</p>
                    <h2 class="fw-bold mb-0 text-primary" th:text="${performance.totalOrders()}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100 kpi-card" th:classappend="${performance.onTimeDeliveryRate() >= 90 ? 'kpi-success' : 'kpi-warning'}">
                <div class="card-body">
                    <p class="text-muted small mb-1">Entregas no Prazo</p>
                    <h2 class="fw-bold mb-0" th:text="${#numbers.formatDecimal(performance.onTimeDeliveryRate(), 1, 0)} + '%'">0%</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100 kpi-card kpi-info">
                <div class="card-body">
                    <p class="text-muted small mb-1">Avaliação de Qualidade</p>
                    <h2 class="fw-bold mb-0 text-info">
                        <span th:text="${#numbers.formatDecimal(performance.averageQualityRating(), 1, 1)}">0.0</span> <small class="text-muted fs-6">/ 5</small>
                    </h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100 kpi-card kpi-success">
                <div class="card-body">
                    <p class="text-muted small mb-1">Avaliação de Preço</p>
                    <h2 class="fw-bold mb-0 text-success">
                        <span th:text="${#numbers.formatDecimal(performance.averagePriceRating(), 1, 1)}">0.0</span> <small class="text-muted fs-6">/ 5</small>
                    </h2>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
