<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{templates/layout :: head}"></head>
<body class="bg-body-secondary">

<th:block th:include="~{templates/fragments/navbar.html}"></th:block>

<main class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-file-earmark-text text-success me-2"></i>Ordens de Compra</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#purchaseModal" th:if="${currentUser.role() != 'OPERATOR'}">
            <i class="bi bi-plus-lg me-1"></i>Nova Ordem
        </button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div id="purchasesTableContainer">
                <th:block th:include="~{templates/fragments/purchases-table.html}"></th:block>
            </div>
        </div>
    </div>
</main>

<!-- Modal Nova Compra -->
<div class="modal fade" id="purchaseModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0 shadow">
            <form action="/compras" method="post">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Nova Ordem de Compra</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-4">
                        <label class="form-label">Fornecedor</label>
                        <select name="supplierId" class="form-select" required>
                            <option value="">Selecione o fornecedor...</option>
                            <option th:each="s : ${suppliers}" th:value="${s.id()}" th:text="${s.name()}"></option>
                        </select>
                    </div>

                    <h6 class="fw-bold mb-3"><i class="bi bi-cart-plus me-2"></i>Insumos</h6>
                    <div id="purchaseItemsList">
                        <div class="row g-2 mb-2 purchase-row">
                            <div class="col-5">
                                <select name="insumoId" class="form-select form-select-sm" required>
                                    <option value="">Insumo...</option>
                                    <option th:each="i : ${insumos}" th:value="${i.id()}" th:text="${i.name()}"></option>
                                </select>
                            </div>
                            <div class="col-3">
                                <input type="number" step="0.001" name="quantity" class="form-control form-control-sm" placeholder="Qtd" required>
                            </div>
                            <div class="col-3">
                                <input type="number" step="0.01" name="unitCost" class="form-control form-control-sm" placeholder="R$ Custo Unit." required>
                            </div>
                            <div class="col-1 text-end">
                                <button type="button" class="btn btn-sm btn-outline-danger w-100" onclick="this.closest('.purchase-row').remove()"><i class="bi bi-x"></i></button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="addPurchaseRow()">
                        <i class="bi bi-plus me-1"></i>Adicionar Insumo
                    </button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Registrar Ordem</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
function addPurchaseRow() {
    const list = document.getElementById('purchaseItemsList');
    if (!list) return;
    const firstRow = list.querySelector('.purchase-row');
    if (firstRow) {
        const clone = firstRow.cloneNode(true);
        clone.querySelector('select').value = '';
        clone.querySelectorAll('input').forEach(i => i.value = '');
        list.appendChild(clone);
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
