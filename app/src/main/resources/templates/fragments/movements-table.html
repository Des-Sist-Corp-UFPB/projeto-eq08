<div class="list-group list-group-flush">
    <div class="list-group-item text-center py-4 text-muted" th:if="${#lists.isEmpty(movements)}">
        Nenhuma movimentação recente.
    </div>
    <div class="list-group-item py-2 px-3" th:each="m : ${movements}">
        <div class="d-flex w-100 justify-content-between align-items-center">
            <h6 class="mb-0 fw-semibold text-truncate" style="max-width: 150px;" th:text="${m.insumoName()}">Insumo</h6>
            <span class="badge" th:classappend="${m.type() == 'INPUT' ? 'bg-success-subtle text-success' : (m.type() == 'OUTPUT' ? 'bg-primary-subtle text-primary' : 'bg-warning-subtle text-warning')}">
                <span th:if="${m.type() == 'OUTPUT' or m.type() == 'ADJUSTMENT'}">-</span>
                <span th:if="${m.type() == 'INPUT'}">+</span>
                <span th:text="${#numbers.formatDecimal(m.quantity(), 1, 'COMMA', 2, 'POINT')}">0</span>
            </span>
        </div>
        <div class="d-flex w-100 justify-content-between mt-1">
            <small class="text-muted" th:text="${m.reason() != null ? m.reason() : m.type()}">Motivo</small>
            <small class="text-muted" th:text="${#temporals.format(m.createdAt(), 'dd/MM HH:mm')}">Data</small>
        </div>
    </div>
</div>
