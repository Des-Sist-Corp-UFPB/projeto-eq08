<div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
            <tr>
                <th>Nome</th>
                <th class="text-end">Estoque Atual</th>
                <th class="text-end">Custo Unitário</th>
                <th class="text-end">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(insumos)}">
                <td colspan="4" class="text-center py-4 text-muted">Nenhum insumo cadastrado.</td>
            </tr>
            <tr th:each="insumo : ${insumos}">
                <td>
                    <div class="fw-semibold" th:text="${insumo.name()}">Nome</div>
                    <div class="small text-muted" th:if="${insumo.minimumStock() > 0}">Mínimo: <span th:text="${insumo.minimumStock()}">0</span> <span th:text="${insumo.unit()}">UN</span></div>
                </td>
                <td class="text-end">
                    <span class="fw-bold" th:classappend="${insumo.currentStock() <= insumo.minimumStock()} ? 'text-danger' : 'text-success'"
                          th:text="${#numbers.formatDecimal(insumo.currentStock(), 1, 'COMMA', 3, 'POINT')}">0</span>
                    <span class="small text-muted" th:text="${insumo.unit()}">UN</span>
                    <i class="bi bi-exclamation-circle-fill text-danger ms-1" th:if="${insumo.currentStock() <= insumo.minimumStock()}" data-bs-toggle="tooltip" title="Estoque abaixo do mínimo"></i>
                </td>
                <td class="text-end" th:text="'R$ ' + ${#numbers.formatDecimal(insumo.unitCost(), 1, 'COMMA', 2, 'POINT')}">R$ 0,00</td>
                <td class="text-end">
                    <!-- Botão de Movimentação Manual -->
                    <button class="btn btn-sm btn-outline-primary me-1" title="Lançar Movimentação"
                            data-bs-toggle="modal" th:data-bs-target="'#moveModal' + ${insumo.id()}">
                        <i class="bi bi-arrow-left-right"></i>
                    </button>
                    <!-- Exclusão -->
                    <form th:action="@{'/insumos/' + ${insumo.id()}}" method="post" class="d-inline" th:if="${currentUser.role() != 'OPERATOR'}">
                        <input type="hidden" name="_method" value="delete">
                        <button type="submit" class="btn btn-sm btn-outline-danger" data-confirm="Excluir este insumo?"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Modais de Movimentação gerados para cada insumo -->
<div th:each="insumo : ${insumos}" class="modal fade" th:id="'moveModal' + ${insumo.id()}" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content border-0 shadow">
            <form th:action="@{'/insumos/' + ${insumo.id()} + '/movimentacao'}" method="post">
                <div class="modal-header bg-light py-2">
                    <h6 class="modal-title fw-bold">Movimentar: <span th:text="${insumo.name()}"></span></h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-3">
                    <div class="mb-3">
                        <label class="form-label small">Tipo</label>
                        <select name="type" class="form-select form-select-sm">
                            <option value="INPUT">Entrada (+)</option>
                            <option value="OUTPUT">Saída (-)</option>
                            <option value="ADJUSTMENT">Ajuste (Perda/Dano)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Quantidade (<span th:text="${insumo.unit()}"></span>)</label>
                        <input type="number" step="0.001" name="quantity" class="form-control form-control-sm" required min="0.001">
                    </div>
                    <div class="mb-2">
                        <label class="form-label small">Motivo</label>
                        <input type="text" name="reason" class="form-control form-control-sm" placeholder="Opcional">
                    </div>
                </div>
                <div class="modal-footer py-2">
                    <button type="submit" class="btn btn-sm btn-primary w-100">Registrar</button>
                </div>
            </form>
        </div>
    </div>
</div>
