<div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
            <tr>
                <th>Fornecedor</th>
                <th>Contato</th>
                <th>Score (IA)</th>
                <th class="text-end">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(suppliers)}">
                <td colspan="4" class="text-center py-4 text-muted">Nenhum fornecedor cadastrado.</td>
            </tr>
            <tr th:each="s : ${suppliers}">
                <td>
                    <div class="fw-semibold" th:text="${s.name()}">Nome</div>
                    <div class="small text-muted" th:if="${s.document() != null}" th:text="${s.document()}">Doc</div>
                </td>
                <td>
                    <div th:text="${s.contactName()}">Contato</div>
                    <div class="small text-muted">
                        <span th:if="${s.phone() != null}"><i class="bi bi-telephone me-1"></i><span th:text="${s.phone()}"></span></span>
                    </div>
                </td>
                <td>
                    <a th:href="@{'/fornecedores/' + ${s.id()} + '/performance'}" class="badge bg-primary text-decoration-none" title="Ver métricas completas">
                        Scorecard <i class="bi bi-arrow-right-short"></i>
                    </a>
                </td>
                <td class="text-end" th:if="${currentUser.role() != 'OPERATOR'}">
                    <form th:action="@{'/fornecedores/' + ${s.id()}}" method="post" class="d-inline">
                        <input type="hidden" name="_method" value="delete">
                        <button type="submit" class="btn btn-sm btn-outline-danger" data-confirm="Excluir este fornecedor?"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
