<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${statusCode} + ' | Gestor de Negócio'">Erro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center p-5">
        <div class="mb-4">
            <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 4rem;"></i>
        </div>
        <h1 class="display-4 fw-bold text-danger" th:text="${statusCode}">Erro</h1>
        <h2 class="h5 text-muted mb-4" th:text="${message}">Mensagem de erro</h2>
        <div class="d-flex gap-2 justify-content-center">
            <a href="/" class="btn btn-primary"><i class="bi bi-house me-2"></i>Ir ao Dashboard</a>
            <button onclick="history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Voltar</button>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
