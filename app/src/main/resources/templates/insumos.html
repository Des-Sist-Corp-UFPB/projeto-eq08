<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{templates/layout :: head}"></head>
<body class="bg-body-secondary">

<th:block th:include="~{templates/fragments/navbar.html}"></th:block>

<main class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-archive text-secondary me-2"></i>Insumos e Estoque</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#insumoModal" th:if="${currentUser.role() != 'OPERATOR'}">
            <i class="bi bi-plus-lg me-1"></i>Novo Insumo
        </button>
    </div>

    <div class="row g-4">
        <!-- Lista de Insumos -->
        <div class="col-12 col-xl-8">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-transparent border-0">
                    <h5 class="fw-bold mb-0">Catálogo de Insumos</h5>
                </div>
                <div class="card-body p-0">
                    <div id="insumosTableContainer">
                        <th:block th:include="~{templates/fragments/insumos-table.html}"></th:block>
                    </div>
                </div>
            </div>
        </div>

        <!-- Histórico de Movimentações -->
        <div class="col-12 col-xl-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0">Últimas Movimentações</h5>
                    <button class="btn btn-sm btn-outline-secondary" hx-get="/insumos/movimentacoes" hx-target="#movementsContainer">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
                <div class="card-body p-0">
                    <div id="movementsContainer">
                        <th:block th:include="~{templates/fragments/movements-table.html}"></th:block>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Modal Novo Insumo -->
<div class="modal fade" id="insumoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <form action="/insumos" method="post">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Novo Insumo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Categoria</label>
                            <select name="categoryId" class="form-select">
                                <option value="">Sem categoria</option>
                                <option th:each="c : ${categories}" th:value="${c.id()}" th:text="${c.name()}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Unidade de Medida</label>
                            <select name="unit" class="form-select" required>
                                <option value="KG">Quilograma (KG)</option>
                                <option value="L">Litro (L)</option>
                                <option value="UN">Unidade (UN)</option>
                                <option value="CX">Caixa (CX)</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Estoque Atual</label>
                            <input type="number" step="0.001" name="currentStock" class="form-control" value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Estoque Mín.</label>
                            <input type="number" step="0.001" name="minimumStock" class="form-control" value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Custo Unit. (R$)</label>
                            <input type="number" step="0.01" name="unitCost" class="form-control" value="0.00">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Insumo</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
