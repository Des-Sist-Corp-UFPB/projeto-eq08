<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{templates/layout :: head}"></head>
<body class="bg-body-secondary">

<th:block th:include="~{templates/fragments/navbar.html}"></th:block>

<main class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-shield-check text-success me-2"></i>Auditoria (Logs)</h1>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="font-size: 0.85rem;">
                    <thead class="table-light">
                        <tr>
                            <th>Data/Hora</th>
                            <th>Ação</th>
                            <th>Usuário</th>
                            <th>Tabela / Registro ID</th>
                            <th>IP</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="5" class="text-center py-4 text-muted">Nenhum log registrado.</td>
                        </tr>
                        <tr th:each="log : ${logs}">
                            <td class="text-muted" th:text="${#temporals.format(log.createdAt(), 'dd/MM/yyyy HH:mm:ss')}">Data</td>
                            <td>
                                <span class="badge bg-light text-dark border font-monospace" th:text="${log.action()}">ACTION</span>
                            </td>
                            <td class="fw-semibold" th:text="${log.userName() != null ? log.userName() : 'Sistema'}">User</td>
                            <td>
                                <span class="text-muted" th:text="${log.tableName()}">Table</span><br>
                                <small class="font-monospace text-secondary" th:text="${log.recordId()}">ID</small>
                            </td>
                            <td class="font-monospace text-muted" th:text="${log.ipAddress() != null ? log.ipAddress() : '-'}">IP</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
