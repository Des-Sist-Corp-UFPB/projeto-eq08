<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestor de Negócio SaaS - Sistema modular de gestão para PMEs">
    <title th:text="${pageTitle} + ' | Gestor de Negócio'">Gestor de Negócio</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS customizado -->
    <link href="/static/css/app.css" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-body-secondary">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-graph-up-arrow me-2"></i>Gestor de Negócio
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#strings.contains(#request.requestURI, '/dashboard') or #request.requestURI == '/'} ? 'active' : ''" href="/">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-box-seam me-1"></i>Estoque
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/insumos"><i class="bi bi-archive me-2"></i>Insumos</a></li>
                        <li><a class="dropdown-item" href="/produtos"><i class="bi bi-card-list me-2"></i>Produtos</a></li>
                        <li><a class="dropdown-item" href="/categorias"><i class="bi bi-tags me-2"></i>Categorias</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#strings.contains(#request.requestURI, '/pdv')} ? 'active' : ''" href="/pdv">
                        <i class="bi bi-cart me-1"></i>PDV
                    </a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-truck me-1"></i>Compras
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/fornecedores"><i class="bi bi-building me-2"></i>Fornecedores</a></li>
                        <li><a class="dropdown-item" href="/compras"><i class="bi bi-file-earmark-text me-2"></i>Ordens de Compra</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-people me-1"></i>Equipe
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/usuarios"><i class="bi bi-person me-2"></i>Colaboradores</a></li>
                        <li><a class="dropdown-item" href="/escalas"><i class="bi bi-calendar3 me-2"></i>Escalas</a></li>
                        <li><a class="dropdown-item" href="/escalas/trocas"><i class="bi bi-arrow-left-right me-2"></i>Trocas</a></li>
                        <li><a class="dropdown-item" href="/escalas/afastamentos"><i class="bi bi-calendar-x me-2"></i>Afastamentos</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/analytics">
                        <i class="bi bi-cpu me-1"></i>Analytics
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2" th:if="${currentUser != null}">
                <span class="badge bg-light text-dark" th:text="${currentUser.role()}"></span>
                <span class="text-white-50 small" th:text="${currentUser.name()}"></span>
                <a href="/logout" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>Sair
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- Conteúdo principal -->
<main class="container-fluid px-4 py-4">
    <th:block th:replace="${content}"></th:block>
</main>

<!-- Footer -->
<footer class="text-center text-muted py-3 small border-top">
    <p class="mb-0">Gestor de Negócio SaaS &copy; 2025 — EQ08 UFPB DSC</p>
</footer>

<!-- Bootstrap 5.3 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
</body>
</html>
